[workspace]
members = ["crates/core", "crates/server", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MartinRovang/meridian"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
fs4 = "0.13"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }
urlencoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
